<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of infrastructure development: bridge, highway, cranes and buildings">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123b5e" />
      <stop offset="100%" stop-color="#0d2a44" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c4c6b" />
      <stop offset="100%" stop-color="#1c3650" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="520" height="420" fill="url(#skyGrad)" opacity="0" />

  <!-- Ground -->
  <rect x="0" y="330" width="520" height="90" fill="#0b2138" />

  <!-- Distant buildings -->
  <g opacity="0.55">
    <rect x="20" y="230" width="34" height="100" fill="url(#buildingGrad)" />
    <rect x="60" y="255" width="26" height="75" fill="url(#buildingGrad)" />
    <rect x="410" y="240" width="30" height="90" fill="url(#buildingGrad)" />
    <rect x="450" y="210" width="38" height="120" fill="url(#buildingGrad)" />
  </g>

  <!-- Mid buildings -->
  <g>
    <rect x="70" y="190" width="46" height="140" fill="#2f5679" />
    <rect x="122" y="150" width="52" height="180" fill="#345d84" />
    <rect x="360" y="170" width="48" height="160" fill="#2f5679" />

    <!-- windows -->
    <g fill="#8fb7d8" opacity="0.55">
      <rect x="78" y="200" width="6" height="8" />
      <rect x="90" y="200" width="6" height="8" />
      <rect x="102" y="200" width="6" height="8" />
      <rect x="78" y="216" width="6" height="8" />
      <rect x="90" y="216" width="6" height="8" />
      <rect x="102" y="216" width="6" height="8" />
      <rect x="78" y="232" width="6" height="8" />
      <rect x="90" y="232" width="6" height="8" />
      <rect x="102" y="232" width="6" height="8" />

      <rect x="130" y="162" width="7" height="9" />
      <rect x="144" y="162" width="7" height="9" />
      <rect x="158" y="162" width="7" height="9" />
      <rect x="130" y="180" width="7" height="9" />
      <rect x="144" y="180" width="7" height="9" />
      <rect x="158" y="180" width="7" height="9" />
      <rect x="130" y="198" width="7" height="9" />
      <rect x="144" y="198" width="7" height="9" />
      <rect x="158" y="198" width="7" height="9" />

      <rect x="368" y="182" width="6" height="8" />
      <rect x="380" y="182" width="6" height="8" />
      <rect x="392" y="182" width="6" height="8" />
      <rect x="368" y="198" width="6" height="8" />
      <rect x="380" y="198" width="6" height="8" />
      <rect x="392" y="198" width="6" height="8" />
    </g>
  </g>

  <!-- Construction crane -->
  <g stroke="#e7ecf1" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="200" y1="330" x2="200" y2="120" />
    <line x1="200" y1="128" x2="300" y2="128" />
    <line x1="200" y1="128" x2="176" y2="150" />
    <line x1="188" y1="128" x2="188" y2="150" />
    <line x1="200" y1="128" x2="200" y2="150" />
  </g>
  <line x1="270" y1="128" x2="270" y2="178" stroke="#e7ecf1" stroke-width="2.5" />
  <rect x="260" y="178" width="20" height="14" rx="1.5" fill="#ff9933" />
  <rect x="192" y="150" width="16" height="10" rx="1.5" fill="#345d84" />

  <!-- Highway / flyover -->
  <path d="M0 356 C 110 356 130 300 230 300 C 330 300 340 356 520 356" fill="none" stroke="#3d6b93" stroke-width="16" stroke-linecap="round" />
  <path d="M0 356 C 110 356 130 300 230 300 C 330 300 340 356 520 356" fill="none" stroke="#e7ecf1" stroke-width="2" stroke-dasharray="10 10" opacity="0.7" />

  <!-- Flyover support pillars -->
  <g fill="#274b6d">
    <rect x="120" y="330" width="10" height="30" />
    <rect x="175" y="308" width="10" height="52" />
    <rect x="270" y="308" width="10" height="52" />
    <rect x="325" y="330" width="10" height="30" />
  </g>

  <!-- Sun / national tricolor accent arc -->
  <g opacity="0.9">
    <circle cx="430" cy="90" r="30" fill="#ff9933" opacity="0.18" />
    <circle cx="430" cy="90" r="16" fill="#ff9933" opacity="0.5" />
  </g>

  <!-- Foreground road -->
  <rect x="0" y="356" width="520" height="64" fill="#132b42" />
  <g fill="#e7ecf1" opacity="0.5">
    <rect x="30" y="386" width="34" height="5" rx="2" />
    <rect x="100" y="386" width="34" height="5" rx="2" />
    <rect x="170" y="386" width="34" height="5" rx="2" />
    <rect x="240" y="386" width="34" height="5" rx="2" />
    <rect x="310" y="386" width="34" height="5" rx="2" />
    <rect x="380" y="386" width="34" height="5" rx="2" />
    <rect x="450" y="386" width="34" height="5" rx="2" />
  </g>
</svg>
